name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pandoc >= 3.0 (filters/diagram.lua requires it), graphviz backs
      # plantuml's layout engine, just runs the recipes.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc graphviz just default-jre-headless

      # apt's plantuml package is stuck at 1.2020.x, which renders diagrams
      # with the old default theme and chokes on newer syntax — nothing like
      # what a current local install produces. Pin the same release line as
      # local development (brew) and wrap it as the `plantuml` binary that
      # filters/diagram.lua invokes.
      - name: Install PlantUML
        env:
          PLANTUML_VERSION: "1.2026.10"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          sudo mv "${RUNNER_TEMP}/plantuml.jar" /opt/plantuml.jar
          printf '#!/bin/sh\nexec java -jar /opt/plantuml.jar "$@"\n' \
            | sudo tee /usr/local/bin/plantuml >/dev/null
          sudo chmod +x /usr/local/bin/plantuml
          plantuml -version | head -1

      - name: Build site
        run: just build-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
